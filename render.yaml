# Render blueprint, production until the beta (EPIC-11 spec, section 2.8):
# one web instance on the free plan runs the API, the worker, and the
# scheduler together, with Postgres and Key Value on their free plans, in
# Singapore. The free instance sleeps when idle: the first request is slow
# and jobs wait until it wakes.
# Card F11 completes it: the image from GitHub Container Registry for each
# release tag, migrations as the pre-deploy step, and the alerts.
# Moving the processes to their own instances before the beta changes this
# file only: each keeps its own command in the one image.
services:
  - type: web
    name: tripmate-api
    runtime: docker
    region: singapore
    plan: free
    numInstances: 1
    dockerfilePath: ./Dockerfile
    dockerCommand: sh -c "python -m app.worker & python -m app.scheduler & exec python -m app.main"
    healthCheckPath: /v1/health
    autoDeploy: false
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: tripmate-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: tripmate-kv
          property: connectionString
      - key: RELEASE_VERSION
        sync: false

  - type: keyvalue
    name: tripmate-kv
    region: singapore
    plan: free
    ipAllowList: []

databases:
  - name: tripmate-db
    region: singapore
    plan: free
    postgresMajorVersion: "16"
    ipAllowList: []
