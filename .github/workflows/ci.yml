# Backend CI (EPIC-11 spec, section 2.9). Each job is one required check on `main`;
# the job `name` is the check's name, so keep the names stable.
# Checks of later cards (F5, F11, F14) join in their own cards.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

env:
  # Every `uv sync` and `uv run` fails when uv.lock is stale against pyproject.toml.
  UV_LOCKED: "1"

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.7"
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  types:
    name: types
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.7"
      - run: uv sync
      - run: uv run mypy app flowchecks

  unit:
    name: unit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.7"
      - run: uv sync
      - name: Unit and property tests
        run: uv run pytest tests/unit -q --junitxml=junit-unit.xml
      - name: Keep the JUnit report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: junit-unit
          overwrite: true
          path: junit-unit.xml
          if-no-files-found: error

  integration:
    name: integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: tripmate_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d tripmate_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # The database name ends in `_test`, as the tests require.
      TEST_DATABASE_URL: postgresql+asyncpg://postgres@127.0.0.1:5432/tripmate_test
      TEST_REDIS_URL: redis://127.0.0.1:6379/0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.7"
      - run: uv sync
      - name: Integration and API tests
        # Everything outside tests/unit, so a new test directory runs in CI.
        run: uv run pytest tests --ignore=tests/unit -q --junitxml=junit-integration.xml
      - name: Keep the JUnit report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: junit-integration
          overwrite: true
          path: junit-integration.xml
          if-no-files-found: error

  requirements:
    name: requirements
    needs: [unit, integration]
    # Reports even when a test job failed (not when the run was cancelled); fails when a JUnit artifact is missing.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.7"
      - run: uv sync
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: junit-unit
          overwrite: true
          path: junit
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: junit-integration
          overwrite: true
          path: junit
      - name: Requirement-to-test report
        run: |
          uv run python -m flowchecks.requirements \
            --ids tests/requirement-ids.txt \
            --junit junit/junit-unit.xml \
            --junit junit/junit-integration.xml \
            --out requirements-report
      - name: Keep the report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: requirements-report
          overwrite: true
          path: requirements-report
          if-no-files-found: ignore

  imports:
    name: imports
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.7"
      - run: uv sync
      - run: uv run lint-imports

  error-codes:
    name: error-codes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read the pinned contracts version
        id: pin
        run: |
          sha="$(tr -d '[:space:]' < contracts-ref)"
          if ! [[ "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "contracts-ref must hold one full 40-character commit SHA of tripmate-contracts" >&2
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: huynguyennang-agilityio/tripmate-contracts
          ref: ${{ steps.pin.outputs.sha }}
          path: contracts
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.7"
      - run: uv sync
      - name: List the codes and check their texts
        run: |
          uv run python -m app.platform.error_codes > error-codes.txt
          uv run python -m flowchecks.error_codes --translations contracts/translations --codes error-codes.txt

  contract:
    name: contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Generating the file and checking its examples need no service. Schemathesis calls the
    # app in process (ASGI) with its lifespan, so it gets PostgreSQL and Redis like
    # `integration`. The contract tests of tests/contract run in `integration`, which runs
    # every test outside tests/unit.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: tripmate_contract
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d tripmate_contract"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.7"
      - run: uv sync
      - name: Generate openapi.json
        run: uv run python -m app.contract generate openapi.json
      - name: Every stub response has an example
        run: uv run python -m app.contract check openapi.json
      - name: Keep the contract
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: openapi
          overwrite: true
          path: openapi.json
          if-no-files-found: error
      - name: Migrate the database
        env:
          DATABASE_URL: postgresql+asyncpg://postgres@127.0.0.1:5432/tripmate_contract
        run: uv run alembic upgrade head
      - name: Schemathesis on the routes that are answered
        # The app with its settings, as the API process runs it: the lifespan connects to the
        # services above, so `/v1/health` answers 200.
        env:
          DATABASE_URL: postgresql+asyncpg://postgres@127.0.0.1:5432/tripmate_contract
          REDIS_URL: redis://127.0.0.1:6379/0
          RELEASE_VERSION: contract-ci
          # Schemathesis sends every request from one address: the general ceiling would stop it.
          RATE_LIMIT_PER_MINUTE: "0"
        run: |
          uv run schemathesis run openapi.json --app app.contract:served_app \
            --exclude-by "/x-stub == true"
      - name: Schemathesis on the stubs
        # A stub answers 501 `server.not_implemented`, which its operation documents with an
        # example; Schemathesis counts any 5xx as a failure, so this pass skips that one
        # check and keeps the others (status, content type, response schema). With no stub
        # there is nothing to select, and Schemathesis would fail.
        env:
          DATABASE_URL: postgresql+asyncpg://postgres@127.0.0.1:5432/tripmate_contract
          REDIS_URL: redis://127.0.0.1:6379/0
          RELEASE_VERSION: contract-ci
          # Schemathesis sends every request from one address: the general ceiling would stop it.
          RATE_LIMIT_PER_MINUTE: "0"
        run: |
          stubs="$(jq '[.paths[][] | select(type == "object" and .["x-stub"] == true)] | length' openapi.json)"
          case "$stubs" in
            ''|*[!0-9]*) echo "::error::Could not count the stubs (got '$stubs')."; exit 1 ;;
          esac
          if [ "$stubs" -gt 0 ]; then
            uv run schemathesis run openapi.json --app app.contract:served_app \
              --include-by "/x-stub == true" --exclude-checks not_a_server_error
          else
            echo "No stub in the contract."
          fi

  migrations:
    name: migrations
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: tripmate_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d tripmate_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Migrations read only DATABASE_URL.
      DATABASE_URL: postgresql+asyncpg://postgres@127.0.0.1:5432/tripmate_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.7"
      - run: uv sync
      - name: Exactly one head
        run: |
          heads="$(uv run alembic heads)"
          echo "$heads"
          count="$(printf '%s\n' "$heads" | grep -c '(head)' || true)"
          if [ "$count" -ne 1 ]; then
            echo "::error::Expected exactly one Alembic head, found $count. Merge the heads."
            exit 1
          fi
      - name: Upgrade to head
        run: uv run alembic upgrade head
      - name: Models match the migrations
        run: uv run alembic check

  audit:
    name: audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.7"
      - run: uv sync
      - name: Audit the locked dependencies
        # The runtime and dev dependencies of uv.lock, pinned to the locked versions.
        run: |
          uv export --locked --no-hashes --no-emit-project --all-groups > "$RUNNER_TEMP/requirements.txt"
          uv run pip-audit --no-deps --disable-pip -r "$RUNNER_TEMP/requirements.txt"

  secrets:
    name: secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks
        # The CLI needs no license key; the archive is checked against the release checksum.
        run: |
          version=8.30.1
          archive="gitleaks_${version}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${version}/${archive}"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks
      - name: Scan the commits of the change
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          PUSH_SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            range="${BASE_SHA}..${HEAD_SHA}"
          elif [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
            range="$PUSH_SHA"
          else
            range="${BEFORE_SHA}..${PUSH_SHA}"
          fi
          "$RUNNER_TEMP/gitleaks" git --log-opts="$range" --redact --verbose --exit-code 1 .
      - name: Scan the checked-out files
        # Files as they are now, not only the commits of the change. The default
        # config skips `.git`; the archive and binary live in $RUNNER_TEMP, outside `.`.
        run: '"$RUNNER_TEMP/gitleaks" dir . --redact --verbose --exit-code 1'

  image:
    name: image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the image (no push)
        run: docker build --tag tripmate-backend:ci .
