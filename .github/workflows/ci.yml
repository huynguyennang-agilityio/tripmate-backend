# Backend CI (EPIC-11 spec, section 2.9). Each job is one required check on `main`;
# the job `name` is the check's name, so keep the names stable.
# Checks of later cards (F4, F5, F11, F12, F13, F14) join in their own cards.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

env:
  UV_FROZEN: "1"

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.7"
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  types:
    name: types
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.7"
      - run: uv sync
      - run: uv run mypy app

  unit:
    name: unit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.7"
      - run: uv sync
      - name: Unit and property tests
        run: uv run pytest tests/unit -q

  integration:
    name: integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: tripmate_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d tripmate_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # The database name ends in `_test`, as the tests require.
      TEST_DATABASE_URL: postgresql+asyncpg://postgres@127.0.0.1:5432/tripmate_test
      TEST_REDIS_URL: redis://127.0.0.1:6379/0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.7"
      - run: uv sync
      - name: Integration and API tests
        run: uv run pytest tests/integration tests/api -q

  imports:
    name: imports
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.7"
      - run: uv sync
      - run: uv run lint-imports

  migrations:
    name: migrations
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: tripmate_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d tripmate_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Migrations read only DATABASE_URL.
      DATABASE_URL: postgresql+asyncpg://postgres@127.0.0.1:5432/tripmate_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.7"
      - run: uv sync
      - name: Exactly one head
        run: |
          heads="$(uv run alembic heads)"
          echo "$heads"
          count="$(printf '%s\n' "$heads" | grep -c '(head)' || true)"
          if [ "$count" -ne 1 ]; then
            echo "::error::Expected exactly one Alembic head, found $count. Merge the heads."
            exit 1
          fi
      - name: Upgrade to head
        run: uv run alembic upgrade head
      - name: Models match the migrations
        run: uv run alembic check

  audit:
    name: audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.7"
      - run: uv sync
      - name: Audit the locked dependencies
        # The runtime and dev dependencies of uv.lock, pinned to the locked versions.
        run: |
          uv export --frozen --no-hashes --no-emit-project --all-groups > "$RUNNER_TEMP/requirements.txt"
          uv run pip-audit --no-deps --disable-pip -r "$RUNNER_TEMP/requirements.txt"

  secrets:
    name: secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks
        # The CLI needs no license key; the archive is checked against the release checksum.
        run: |
          version=8.30.1
          archive="gitleaks_${version}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${version}/${archive}"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks
      - name: Scan the commits of the change
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          PUSH_SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            range="${BASE_SHA}..${HEAD_SHA}"
          elif [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
            range="$PUSH_SHA"
          else
            range="${BEFORE_SHA}..${PUSH_SHA}"
          fi
          "$RUNNER_TEMP/gitleaks" git --log-opts="$range" --redact --verbose --exit-code 1 .

  image:
    name: image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the image (no push)
        run: docker build --tag tripmate-backend:ci .
