# The risk gate on every pull request to `main`: the check `gate / risk-gate`, required on `main`.
# It is `pull_request_target`, so this file and the reusable workflow it calls are the base
# branch's, which a pull request cannot edit; risk-gate-check.yml explains why that is safe (the
# head is only fetched and diffed, never checked out or run).
# `labeled` and `unlabeled` run it again when `human-approved` is added or removed (only the
# product owner adds it); `edited` and `synchronize` when the pull request changes. A push
# (`synchronize`) removes the label `human-approved` first (see risk-gate-check.yml).
name: Risk gate

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]

permissions:
  contents: read

concurrency:
  # A push has its own group, so a later `edited`, `labeled`, or `unlabeled` run never cancels the
  # run that removes `human-approved`; a newer push still replaces an older one.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}-${{ github.event.action == 'synchronize' && 'push' || 'other' }}
  cancel-in-progress: true

jobs:
  gate:
    # `pull-requests: write` only so that the called job `revoke-approval` can remove the label
    # after a push; the called workflow gives it to that job alone. `checks: read` lets the called
    # job `risk-gate` read the head commit's check suites (when it reached the pull request); a
    # called job cannot have a permission its caller does not grant, or the run fails to start.
    permissions:
      contents: read
      pull-requests: write
      checks: read
    uses: ./.github/workflows/risk-gate-check.yml
    with:
      rules-file: .github/risk-paths.toml
      # The checks as they are on `main`.
      flowchecks-ref: ${{ github.event.pull_request.base.sha }}
