# The risk gate on every pull request to `main`: the check `gate / risk-gate`, required on `main`.
# It is `pull_request_target`, so this file and the reusable workflow it calls are the base
# branch's, which a pull request cannot edit; risk-gate-check.yml explains why that is safe (the
# head is only fetched and diffed, never checked out or run).
# `labeled` and `unlabeled` run it again when `human-approved` is added or removed (only the
# product owner adds it); `edited` and `synchronize` when the pull request changes.
name: Risk gate

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  gate:
    uses: ./.github/workflows/risk-gate-check.yml
    with:
      rules-file: .github/risk-paths.toml
      # The checks as they are on `main`.
      flowchecks-ref: ${{ github.event.pull_request.base.sha }}
